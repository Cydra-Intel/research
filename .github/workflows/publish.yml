# Publishes research.cydraintel.ai. An article is a folder articles/YYYY-MM-DD-slug/ with a PDF
# and a hero image: on a push, its PDF becomes article.md + images/ (committed back, to edit
# later), and the site is built and deployed. An article goes live at 10:00 New York time on its
# folder's date: the runs at 10:05 (one cron for EDT, one for EST) rebuild the site then.
name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 14 * * *' # 10:05 New York in summer (EDT)
    - cron: '5 15 * * *' # 10:05 New York in winter (EST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the converted article.md and images back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Convert new PDFs to Markdown
        run: python tools/build.py convert
      - name: Commit the converted articles
        run: |
          git add articles
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Convert new article PDFs to Markdown"
          git push -q
      - name: Build the site
        run: python tools/build.py build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
